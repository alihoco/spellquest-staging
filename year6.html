<body><main><header><a class="logo" href="/" aria-label="Spellmaster home"><img class="brand-art" src="/assets/spellmaster/spellmaster-logo-ornate.webp" width="1120" height="373" alt="Spellmaster" loading="eager" decoding="async"></a><span class="muted small">Better today than yesterday</span></header>
<section class="hero"><span class="eyebrow">YOUR OWN SPELLING ADVENTURE</span><h1>Discover words. Build confidence.</h1><p>Little challenges, a patient voice, and a teacher that remembers what helps you learn.</p></section>
<section class="panel" id="app"></section>
<div class="footer">Staging curriculum adventure · 615-word England inventory · Progress stays in this browser</div></main>

<script src="/learner-profiles.js"></script>
<script src="/bonus-round.js"></script>

<script>
let WORDS=[
 {word:'necessary',spelling:['ne','ces','sa','ry'],sounds:['ness','uh','ser','ee']},
 {word:'embarrass',spelling:['em','bar','rass'],sounds:['im','bar','uhs']},
 {word:'accommodate',spelling:['ac','com','mo','date'],sounds:['uh','kom','uh','dayt']},
 {word:'government',spelling:['gov','ern','ment'],sounds:['guv','ern','ment']},
 {word:'foreign',spelling:['for','eign'],sounds:['for','in']},
 {word:'familiar',spelling:['fa','mil','iar'],sounds:['fuh','mil','yuh']},
 {word:'environment',spelling:['en','viron','ment'],sounds:['in','vy','run','ment']},
 {word:'privilege',spelling:['priv','i','lege'],sounds:['priv','uh','lij']},
 {word:'rhythm',spelling:['rhyth','m'],sounds:['rith','um']},
 {word:'temperature',spelling:['tem','per','a','ture'],sounds:['tem','pruh','chuh']}
];
const PILOT_BY_WORD=Object.fromEntries(WORDS.map(w=>[w.word,w]));
let curriculumLoaded=false,curriculumLoadPromise=null,curriculumLoadFailure='';
function wordAudioClip(word=WORDS[idx]){
 return word?.id?'catalogue-word-'+word.id+'-v1':'y6-'+word.word;
}
function nextAudioClip(word=WORDS[idx]){
 return word?.id?'catalogue-next-'+word.id+'-v1':'spellmaster-next-'+word.word+'-v1';
}
async function ensureCurriculumLoaded(){
 if(curriculumLoaded)return WORDS;
 if(curriculumLoadPromise)return curriculumLoadPromise;
 curriculumLoadPromise=fetch('/core/national-curriculum-catalogue.json',{cache:'force-cache'})
  .then(async r=>{if(!r.ok)throw Error('The curriculum library could not be loaded');return r.json()})
  .then(raw=>{
   const converted=window.SpellmasterCurriculum.prepare(raw,PILOT_BY_WORD);
   WORDS=converted;
   curriculumLoaded=true;curriculumLoadFailure='';
   return WORDS;
  })
  .catch(error=>{curriculumLoadFailure=String(error?.message||error);throw error})
  .finally(()=>{curriculumLoadPromise=null});
 return curriculumLoadPromise;
}
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const ENDPOINT='https://spellquest-voice-staging.onrender.com/api/voice';
let voice=sessionStorage.getItem('spellquest-ai-voice')||'marin';
let narration=localStorage.getItem('spellquest-audio-first')!=='off';
let pace=localStorage.getItem('spellquest-sound-pace')||'relaxed';
let stage='welcome',idx=0,first=0,results=[],ticket=0,activePlayer=null,activePlaying=false,activeResolve=null;
const cached=new Map();
const makeUrl=clip=>{
 const key=voice+':'+clip;
 if(!cached.has(key)){
  const prom=fetch(ENDPOINT+'?clip='+encodeURIComponent(clip)+'&voice='+encodeURIComponent(voice))
   .then(r=>{if(!r.ok)throw new Error('Voice error '+r.status);return r.blob()})
   .then(blob=>URL.createObjectURL(blob))
   .catch(e=>{cached.delete(key);throw e});
  cached.set(key,prom);
 }
 return cached.get(key);
};
function warm(clips){/* Deliberately disabled concurrent TTS prefetch: welcome audio takes priority. */}
function setStatus(msg){const el=$('audio-status');if(el)el.textContent=msg}
function stop(){
 ticket++;
 if(activePlayer){activePlayer.pause();activePlayer.onended=null;activePlayer.onerror=null;activePlayer=null}
 if(activeResolve){activeResolve(false);activeResolve=null}
 activePlaying=false;
}
async function speak(clip,t=ticket){
 if(t!==ticket)return false;
 setStatus('🔊 Preparing your narrator…');
 try{
  const url=await makeUrl(clip);if(t!==ticket)return false;
  const player=new Audio(url);activePlayer=player;
  const ended=new Promise(resolve=>{activeResolve=resolve;player.onended=()=>{activeResolve=null;resolve(true)};player.onerror=()=>{activeResolve=null;resolve(false)}});
  await player.play();activePlaying=true;
  const ok=await ended;activePlaying=false;
  if(t===ticket){activePlayer=null;setStatus(ok?'':'The voice stopped. Please replay this step.')}
  return t===ticket&&ok;
 }catch(e){
  if(t===ticket)setStatus('Audio could not play. Please try Replay instructions.');
  activePlaying=false;return false;
 }
}
function pause(ms,t){return new Promise(resolve=>setTimeout(()=>resolve(t===ticket),ms))}
async function talk(clips,t=ticket){
 if(!narration)return false;
 for(const clip of clips){if(t!==ticket)return false;if(!(await speak(clip,t)))return false}
 return true;
}
function soundVoice(){return '<div class="voice"><div class="voice-row"><label for="voice">Narrator</label><select id="voice" onchange="chooseVoice(this.value)"><option value="marin">Marin · warm</option><option value="cedar">Cedar · calm</option></select><label for="pace">Practice pace</label><select id="pace" onchange="choosePace(this.value)"><option value="relaxed">Relaxed</option><option value="extra">Extra thinking time</option></select><button class="alt" onclick="toggleAudio()" id="audio-toggle">'+(narration?'🔊 Sound on':'🔇 Sound off')+'</button></div><span class="status" id="audio-status" role="status"></span></div>'}
function voiceSet(){if($('voice'))$('voice').value=voice;if($('pace'))$('pace').value=pace}
function chooseVoice(v){stop();voice=v;sessionStorage.setItem('spellquest-ai-voice',v);cached.clear();if(narration)replay()}
function choosePace(v){pace=v;localStorage.setItem('spellquest-sound-pace',v)}
function toggleAudio(){narration=!narration;localStorage.setItem('spellquest-audio-first',narration?'on':'off');stop();if($('audio-toggle'))$('audio-toggle').textContent=narration?'🔊 Sound on':'🔇 Sound off';if(narration)replay()}
function replay(){
 if(stage==='welcome')return introAudio();
 if(stage==='question')return instructionAudio();
 if(stage==='review')return reviewAudio();
 if(stage==='short-review')return shortReviewAudio();
 if(stage==='retry')return retryAudio();
 if(stage==='success')return successAudio();
 if(stage==='finished')return speak('y6-v08-complete');
}
function progress(){
 const n=Math.min(5,Math.max(0,((Math.max(runCount,1)-1)%5)+1));
 return '<div class="progress" role="progressbar" aria-label="Current five-word chapter" aria-valuemin="0" aria-valuemax="5" aria-valuenow="'+n+'"><div style="width:'+(n/5*100)+'%"></div></div>';
}
function welcome(){
 stop();stage='welcome';
 app.innerHTML='<span class="eyebrow">WELCOME, WORD EXPLORER!</span><h2>Your adventure starts here 🌟</h2>'+
 '<p>We’ll explore spellings at your own pace. Words you already know move into your collection, and tricky words get extra help. You can listen again or finish whenever you like.</p>'+
 '<p>We’re not testing how you compare to anybody else. We’re finding out what you can learn.</p>'+
 soundVoice()+'<div class="actions"><button onclick="begin()">▶ Start and hear your welcome</button></div>'+
 '<p class="muted small">Tap Start once to enable audio. Your narrator explains the next steps aloud.</p>';
 voiceSet();warm(['spellmaster-adaptive-welcome-v1','y6-v08-prompt','y6-necessary','y6-v08-wrong']);
}
async function introAudio(){
 stop();const t=ticket;
 const ok=await talk(['spellmaster-adaptive-welcome-v1'],t);
 if(ok&&t===ticket&&stage==='welcome')question(true);
}
function begin(){idx=0;first=0;results=[];narration=true;localStorage.setItem('spellquest-audio-first','on');introAudio()}
function question(auto=false){
 stop();stage='question';const w=WORDS[idx];
 app.innerHTML='<span class="eyebrow">SPELLING CHALLENGE '+runCount+'</span>'+progress()+
 '<h2>Listen, then spell</h2><p>Listen to the word. Type the spelling when you are ready. You can hear it as often as you need.</p>'+
 '<div class="actions"><button class="alt" data-word-replay="true" onclick="replayCurrentWord()">🔊 Hear word again</button><button class="alt" onclick="instructionAudio()">🔊 Replay instructions</button></div>'+
 '<label for="answer">Your spelling</label><input id="answer" aria-label="Type the spelling of the spoken word" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')check(false)">'+soundVoice()+
 '<div class="actions"><button onclick="check(false)">Check my spelling →</button>'+
 '<button class="alt" onclick="finish()">Finish for today</button></div>';
 voiceSet();
 if(auto&&narration)instructionAudio();
}
async function instructionAudio(){
 stop();const t=ticket,word=WORDS[idx]?.word;if(!word)return false;
 const clips=runCount>1?[nextAudioClip(WORDS[idx])]:['y6-v08-prompt',wordAudioClip(WORDS[idx])];
 const ok=await talk(clips,t);
 if(!ok&&t===ticket&&stage==='question'){
  setStatus('The word could not be heard. Tap Hear word again before spelling.');
  const button=app.querySelector('[data-word-replay]');
  if(button)button.focus({preventScroll:true});
 }
 return ok;
}
function replayCurrentWord(){
 stop();const t=ticket;const word=WORDS[idx]?.word;
 if(!word)return false;
 return speak(wordAudioClip(WORDS[idx]),t);
}
function check(retry){

function nextAfterBonus(){
 stop();const upcoming=adaptiveSelect();
 if(!upcoming){finish();return}
 stage='choice';
 app.innerHTML='<span class="eyebrow">YOUR CHOICE</span><h2>Keep exploring?</h2>'+
 '<p>Your bonus round is complete. Would you like another challenge or finish for today?</p>'+
 soundVoice()+'<div class="actions"><button onclick="adaptiveStartWord()">Another word →</button>'+
 '<button class="alt" onclick="finish()">Finish for today</button></div>';
 voiceSet();
}
next=function(){
 stop();
 const plan=window.SpellmasterBonus?.chooseRound(runResults,bonusReviewedThrough);
 if(plan){bonusReviewedThrough=runResults.length;startBonusRound(plan);return}
 const selection=adaptiveSelect();
 if(!selection)return finish();
 const elapsed=(Date.now()-runStart)/60000;
 // A gentle check-in about every eight minutes; no maximum time or number of words.
 if(elapsed<8||elapsed-lastBreakPromptAt<8){adaptiveStartWord();return}
 lastBreakPromptAt=elapsed;
 stage='choice';
 app.innerHTML='<span class="eyebrow">YOUR CHOICE</span><h2>Keep exploring?</h2>'+
 '<p>You have had a good practice session. Would you like to continue or finish for today?</p>'+
 '<div class="note">A short break can help. You can keep practising whenever you want. Old and new words stay in the adventure together.</div>'+
 soundVoice()+'<div class="actions"><button onclick="adaptiveStartWord()">Keep exploring →</button>'+
 '<button class="alt" onclick="finish()">Finish for today</button></div>';
 voiceSet();
};
finish=function(){
 stop();stage='finished';
 const remembered=runResults.filter(x=>x.initial).length;
 app.innerHTML='<span class="eyebrow">YOUR JOURNEY</span><h2>Look how far you have come! 🌟</h2>'+
 '<div class="good">You completed <strong>'+runCount+'</strong> word challenges across <strong>'+new Set(runResults.map(x=>x.word)).size+'</strong> different words. <strong>'+remembered+
 '</strong> were correct on the first try.</div>'+
 '<p>Words you knew are saved for later review. Tricky words will return with a fresh opportunity to learn.</p>'+
 runResults.map(x=>'<div class="result"><strong>'+x.word+'</strong> — '+
 (x.initial?'Spelled independently':x.learned?'Improved with help':'Ready to practise again')+'</div>').join('')+
 soundVoice()+'<div class="actions"><button onclick="welcome()">Back to welcome</button>'+
 '<button class="alt" onclick="location.href=\'/\'">Home</button></div>';
 voiceSet();if(narration)talk(['y6-v08-complete']);
};
</script><script>
// Local test-only profile launcher. Does not authenticate or upload learning data.
const LP=window.SpellmasterProfiles;
function htmlSafe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentTheme(p){return p.theme==='auto'?LP.themeForAge(LP.ageInYears(p.birth)):p.theme}
function createLocalProfile(){
 const alias=$('new-alias')?.value||'',birth=$('new-birth')?.value||'';
 const yearValue=$('new-school-year')?.value||'';
 try{LP.add(localStorage,{alias,birth,schoolYear:yearValue?Number(yearValue):null});renderLanding()}
 catch(e){const el=$('profile-error');if(el)el.textContent=e.message}
}
function chooseLocalProfile(id){try{LP.choose(localStorage,id);renderLanding()}catch(e){const el=$('profile-error');if(el)el.textContent=e.message}}
function setLocalTheme(value){const p=LP.active(localStorage);if(!p)return;LP.updateTheme(localStorage,p.id,value);renderLanding()}
function changeSchoolYear(value){
 const p=LP.active(localStorage);if(!p)return;
 const changed=LP.updateSchoolYear(localStorage,p.id,value?Number(value):null);
 window.SpellmasterCurriculum.resetStartingPoint(localStorage,changed,LP.ageInYears(changed.birth));
 renderLanding();
}
function deleteLocalProfile(){
 const p=LP.active(localStorage);if(!p)return;
 if(!confirm('Delete this tester profile and its locally saved spelling history from this device?'))return;
 LP.forget(localStorage,p.id);renderLanding();
}
function claimPendingAvatarItem(){
 const p=LP.active(localStorage),due=p?window.SpellmasterBonus.pendingRewards(localStorage,p):[];
 if(!p||!due.length)return;
 stop();stage='avatar-reward';
 app.innerHTML='<div class="bonus-card"><h2>Your earned avatar reward</h2>'+
 '<p>You can choose any of the items below. Your coins and spelling progress are unchanged.</p>'+
 '<div class="actions"><button class="alt" onclick="renderLanding()">Back to adventure</button></div></div>';
 showAvatarRewardChoice(p,due[0]);
}
function renderLanding(){
 stop();stage='welcome';
 const people=LP.readProfiles(localStorage),p=LP.active(localStorage);
 document.body.dataset.theme=p?currentTheme(p):'explorer';
 const progress=p?LP.summary(adaptiveLoad(),adaptiveToday()):null;
 const placement=p?window.SpellmasterCurriculum.readPlacement(localStorage,p,LP.ageInYears(p.birth)):null;
 const bandLabels={year1:'Year 1',year2:'Year 2',year3_4:'Years 3–4',year5_6:'Years 5–6'};
 const bonuses=p&&window.SpellmasterBonus?window.SpellmasterBonus.read(localStorage,p):null;
 const unclaimed=p&&window.SpellmasterBonus?window.SpellmasterBonus.pendingRewards(localStorage,p):[];
 const splitter=p&&window.SpellmasterChunkUI?window.SpellmasterChunkUI.summary(window.SpellmasterChunkUI.read(localStorage,p)):null;
 const cards=people.map(x=>'<button class="profile-choice '+(p&&p.id===x.id?'selected':'')+
 '" onclick="chooseLocalProfile(\''+x.id+'\')"><span>✦ '+htmlSafe(x.alias)+'</span><small>'+
 (p&&p.id===x.id?'Current explorer ✓':'Switch')+'</small></button>').join('');
 const themeOptions=['auto','wonder','explorer','adventure','focus'];
 app.innerHTML='<div class="start-layout"><section><span class="start-kicker">Welcome to your next adventure</span>'+
 '<h2 style="font-size:clamp(28px,4vw,39px);line-height:1.15;margin:12px 0">'+
 (p?'Ready to discover, '+htmlSafe(p.alias)+'?':'Every great speller starts somewhere.')+'</h2>'+
 '<p class="start-desc">Hear a word, give it a go, and get helpful clues when you need them. Take a break whenever you want.</p>'+
 '<div class="next-chapter" aria-label="Your next chapter"><span class="chapter-icon" aria-hidden="true">✦</span>'+
 '<div><span class="chapter-kicker">YOUR NEXT CHAPTER</span>'+
 '<h3>'+(p&&progress&&progress.dueWords?'Words to remember':'A word adventure awaits')+'</h3>'+
 '<p>'+(p&&progress&&progress.dueWords?'You have '+progress.dueWords+' word'+(progress.dueWords===1?'':'s')+' ready to revisit.':
 p&&progress&&progress.wordsSeen?'You have explored '+progress.wordsSeen+' word'+(progress.wordsSeen===1?'':'s')+'. Keep discovering!':
 'Listen, practise and collect words as you go.')+'</p></div></div>'+
 (p?'<div style="margin-top:20px"><button class="play-now" onclick="begin()"><span class="play-icon">▶</span> Play now</button>'+
 '<button class="alt tiny-action" style="margin:14px 0 0 10px" onclick="hearWelcomeAgain()">🔊 Hear welcome again</button>'+
 '<p class="small" style="margin-top:15px">✦ Practise at your own pace, including words you have seen before.</p></div>':
 '<p class="note">Create a local tester profile to start. This is not yet a secure account.</p>')+
 (progress?'<div class="statline"><div class="stat"><strong>'+progress.wordsSeen+'</strong><small>Words explored</small></div>'+
 '<div class="stat"><strong>'+progress.initialCorrect+'</strong><small>Known first try</small></div>'+
 '<div class="stat"><strong>'+progress.dueWords+'</strong><small>Ready to revisit</small></div></div>'+
 '<span class="label-chip">'+(progress.delayedRetained?'Some words recalled later':'Your memory journey begins here')+'</span>'+
 (placement?'<p class="small" style="margin-top:12px">Current spelling range: <strong>'+bandLabels[placement.currentBand]+'</strong>'+
 (placement.currentBand!==placement.baselineBand?' · adjusted from '+bandLabels[placement.baselineBand]+' using independent spelling':' · suggested initially from '+(p.schoolYear?'school year':'age'))+
 '. This is not a fixed limit.</p>':'')+
 (bonuses&&bonuses.rounds.length?'<div class="bonus-currency">🪙 '+bonuses.coins+' coins · ✦ '+bonuses.bonusPoints+' bonus points</div>'+
 (bonuses.inventory.length?'<div class="label-chip">✨ '+bonuses.inventory.length+' avatar item'+(bonuses.inventory.length===1?'':'s')+' collected</div>':'')+
 (unclaimed.length?'<p class="note">You have '+unclaimed.length+' unclaimed avatar reward'+(unclaimed.length===1?'':'s')+'.</p><button class="alt" onclick="claimPendingAvatarItem()">Choose my reward</button>':''):'')+
 (progress.difficulties.length?'<h3 style="margin-bottom:6px">What we are practising</h3>'+
 progress.difficulties.map(item=>'<div class="difficulty-pill">'+htmlSafe(item.pattern)+
 ' · '+item.misses+' practice opportunit'+(item.misses===1?'y':'ies')+'</div>').join(''):'')+
 '<p class="privacy-note">These are early learning observations, not diagnoses or fixed learning styles.</p>':'')+
 (splitter&&splitter.offered?'<div class="note"><strong>Your word groups</strong><p class="small">You tried your own grouping for '+splitter.changedOpportunities+' of '+splitter.offered+' word opportunities. Saved groups reused: '+splitter.reuses+'.</p><p class="privacy-note">This shows feature use, not whether it improved spelling. Data stays in this browser.</p></div>':'')+
 '</section><aside class="profile-panel"><h3>✦ Your explorer</h3>'+
 '<p>One explorer at a time. Your learning journey belongs to you.</p>'+
 (p?'<div class="active-learner" aria-label="Current explorer"><span class="active-learner-icon" aria-hidden="true">✦</span>'+
 '<div><strong>'+htmlSafe(p.alias)+'</strong><small>Current explorer · Personal progress</small></div></div>':'')+
 '<details class="tester-profile-tools"'+(p?'':' open')+'><summary>⚙ Tester profile tools</summary>'+
 '<p class="privacy-note">Only for local staging tests. In the finished game, switching learners requires authorised sign-in.</p>'+cards+
 (people.length<6?'<div class="profile-form"><label for="new-alias">Explorer nickname</label>'+
 '<input id="new-alias" maxlength="18" placeholder="e.g. Star Explorer" autocomplete="off" spellcheck="false">'+
 '<label for="new-birth">Birth month and year</label>'+
 '<input id="new-birth" type="month" min="1920-01" max="'+new Date().toISOString().slice(0,7)+'">'+
 '<label for="new-school-year">School year (optional)</label>'+
 '<select id="new-school-year"><option value="">Suggest from age</option>'+
 [1,2,3,4,5,6].map(y=>'<option value="'+y+'">Year '+y+'</option>').join('')+'</select>'+
 '<p class="privacy-note">School year only decides where we begin. Your spelling can move us up or down.</p>'+
 '<button class="alt" onclick="createLocalProfile()">+ Create tester profile</button>'+
 '<div class="status" id="profile-error" role="status"></div></div>':'')+
 (p?'<button class="alt tiny-action" style="margin:5px 12px 9px" onclick="deleteLocalProfile()">Delete current test profile</button>':'')+
 '</details>'+
 (p?'<div style="padding-top:13px"><label for="local-theme">Choose how the game looks</label>'+
 '<select id="local-theme" onchange="setLocalTheme(this.value)">'+themeOptions.map(x=>'<option value="'+x+'"'+
 (p.theme===x?' selected':'')+'>'+({auto:'Adjust with age',wonder:'Wonder',explorer:'Explorer',adventure:'Adventure',focus:'Simple & calm'}[x])+'</option>').join('')+
 '</select>'+
 '<label for="local-school-year">Starting school year (optional)</label>'+
 '<select id="local-school-year" onchange="changeSchoolYear(this.value)">'+
 '<option value=""'+(!p.schoolYear?' selected':'')+'>Suggest from age</option>'+
 [1,2,3,4,5,6].map(y=>'<option value="'+y+'"'+(p.schoolYear===y?' selected':'')+'>Year '+y+'</option>').join('')+
 '</select><p class="privacy-note">This is just a starting estimate. Independent spelling can move the level up or down.</p></div>':'')+
 '<p class="privacy-note" style="margin-top:15px">Testing only: profiles and birth month/year stay in this browser, not a server. Anyone using this device can access them. Use nicknames, not real names. Clearing browser data removes your progress.</p>'+
 '</aside></div>'+
 '<div class="site-note">The staging player now uses the 615-word England spelling inventory, with an age/year-based starting point and continued assessment. New words have provisional whole-word audio and visual spelling only; expert-reviewed phonics, meanings and homophone contexts still need sign-off. <a href=\"/curriculum-library.html\">Browse the word bank</a>. Progress remains browser-local.</div>';
}
const playWithProfile=begin;
begin=async function(){
 if(!LP.active(localStorage)){renderLanding();return}
 stop();stage='curriculum-loading';
 app.innerHTML='<span class="eyebrow">YOUR SPELLING ADVENTURE</span><h2>Preparing your words</h2>'+
 '<p>Loading the England curriculum word bank and your personal starting point…</p>'+
 '<div class="note" role="status">This uses only your local test profile. Nothing has been submitted to a school account.</div>';
 try{await ensureCurriculumLoaded()}
 catch(error){
  stage='curriculum-error';
  app.innerHTML='<h2>Word bank unavailable</h2><p>We could not load the wider curriculum just now. Your saved progress is safe.</p>'+
   '<div class="actions"><button onclick="begin()">Try loading again</button>'+
   '<button class="alt" onclick="renderLanding()">Back to my explorer</button></div>';
  return;
 }
 // Keep the existing first-game narration and progress-history behaviour.
 stage='welcome';playWithProfile();
};
welcome=renderLanding;
renderLanding();
</script><script src="/spellmaster-library.js?v=5"></script>
</body></html>
