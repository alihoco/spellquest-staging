<!doctype html><html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#554ac4"><title>Spellmaster — Year 6 Sound-First Adventure</title>
<style>
:root{font-family:system-ui,"Trebuchet MS",Arial,sans-serif;color:#24324f;background:#f6f5fe}*{box-sizing:border-box}
body{margin:0;background:linear-gradient(120deg,#e7f8ff,#fff6ef 55%,#f1eaff);min-height:100vh}
main{max-width:850px;margin:auto;padding:20px 16px 45px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{text-decoration:none;font-size:24px;font-weight:900;color:#584bc1}
h1{font-size:clamp(29px,5vw,43px);margin:8px 0}h2{font-size:clamp(23px,4vw,29px)}
.hero{background:linear-gradient(110deg,#5147be,#967df1);color:white;padding:30px;border-radius:28px;margin:20px 0;box-shadow:0 10px 28px #574bb522}
.hero p{line-height:1.6;margin-bottom:0}.hero .eyebrow{color:#e9e4ff}
.panel{background:white;border-radius:25px;padding:27px;box-shadow:0 10px 30px #625aaf14}
.eyebrow{font-size:12px;letter-spacing:1px;font-weight:900;text-transform:uppercase;color:#6053ba}.muted{color:#62708b}.small{font-size:13px;line-height:1.5}
p{line-height:1.6}
button,input,select{font:inherit}
button{border:0;cursor:pointer;border-radius:14px;padding:13px 17px;font-weight:800;background:#6051cc;color:white;min-height:46px}
button.alt{background:#eae7ff;color:#43368a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #efbb56;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
input{width:100%;font-size:23px;border:2px solid #ccd5ea;border-radius:15px;padding:16px;margin:8px 0 15px}
label{display:block;font-weight:800;margin:14px 0 5px}
.voice{background:#f3f1ff;border-radius:16px;padding:14px;margin:15px 0}
.voice-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voice label{margin:0;font-size:13px}
.voice select{padding:8px;border:2px solid #dadbf1;border-radius:9px;color:#283554;background:white}
.voice button{font-size:13px;min-height:36px;padding:8px 11px}
.status{min-height:20px;display:block;font-size:13px;color:#54647e;margin-top:8px}
.progress{height:13px;background:#e7e9f5;overflow:hidden;border-radius:99px;margin:18px 0}
.progress>div{background:#5abf9e;height:100%}
.sound-row,.spelling-row{display:flex;flex-wrap:wrap;gap:10px;margin:19px 0}
.sound{min-width:70px;padding:17px 20px;border-radius:15px;background:#dceeff;color:#253353;font-size:clamp(21px,4vw,30px);font-weight:850;text-align:center}
.sound:nth-child(2n){background:#ffebc4}.sound:nth-child(3n){background:#e0f7e9}
.sound.active{background:#6252d0!important;color:white;box-shadow:0 0 0 5px #e4dcff}
.sound small{display:block;font-size:12px;font-weight:600;margin-top:4px}
.spelling-row span{padding:15px 18px;background:#dfeeff;border-radius:13px;font-size:clamp(23px,4vw,33px);font-weight:850}
.spelling-row span:nth-child(2n){background:#ffe8b8}.spelling-row span:nth-child(3n){background:#e1f7ea}
.tip{background:#fff8e9;border:2px solid #ffe1a4;padding:18px;border-radius:15px;margin:18px 0}
.note{background:#f0f5ff;border-radius:15px;padding:15px;margin:15px 0}
.good{background:#e2f5e9;border-radius:15px;padding:17px}
.result{padding:12px;background:#f1f0ff;border-radius:10px;margin:8px 0}
.now{color:#4b369e;font-weight:800;font-size:16px}
.footer{text-align:center;font-size:12px;color:#63708c;padding:18px}
@media(max-width:500px){.panel{padding:18px}main{padding:12px}.hero{padding:24px}.sound{min-width:58px;padding:13px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><main><header><a class="logo" href="/">✨ Spellmaster</a><span class="muted small">Better today than yesterday</span></header>
<section class="hero"><span class="eyebrow">YOUR OWN SPELLING ADVENTURE</span><h1>Hear it. Say it. Spell it.</h1><p>Learn Year 6 spellings one step at a time, with a friendly voice to explain every stage.</p></section>
<section class="panel" id="app"></section>
<div class="footer">Year 5–6 spelling adventures · Learn at your own pace · Your progress stays in this browser</div></main>
<script>
const WORDS=[
 {word:'necessary',spelling:['ne','ces','sa','ry'],sounds:['ness','uh','ser','ee']},
 {word:'embarrass',spelling:['em','bar','rass'],sounds:['im','bar','uhs']},
 {word:'accommodate',spelling:['ac','com','mo','date'],sounds:['uh','kom','uh','dayt']},
 {word:'government',spelling:['gov','ern','ment'],sounds:['guv','ern','ment']},
 {word:'foreign',spelling:['for','eign'],sounds:['for','in']},
 {word:'familiar',spelling:['fa','mil','iar'],sounds:['fuh','mil','yuh']},
 {word:'environment',spelling:['en','viron','ment'],sounds:['in','vy','run','ment']},
 {word:'privilege',spelling:['priv','i','lege'],sounds:['priv','uh','lij']},
 {word:'rhythm',spelling:['rhyth','m'],sounds:['rith','um']},
 {word:'temperature',spelling:['tem','per','a','ture'],sounds:['tem','pruh','chuh']}
];
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const ENDPOINT='https://spellquest-voice-staging.onrender.com/api/voice';
let voice=sessionStorage.getItem('spellquest-ai-voice')||'marin';
let narration=localStorage.getItem('spellquest-audio-first')!=='off';
let pace=localStorage.getItem('spellquest-sound-pace')||'relaxed';
let stage='welcome',idx=0,first=0,results=[],ticket=0,activePlayer=null,activePlaying=false,activeResolve=null;
const cached=new Map();
const makeUrl=clip=>{
 const key=voice+':'+clip;
 if(!cached.has(key)){
  const prom=fetch(ENDPOINT+'?clip='+encodeURIComponent(clip)+'&voice='+encodeURIComponent(voice))
   .then(r=>{if(!r.ok)throw new Error('Voice error '+r.status);return r.blob()})
   .then(blob=>URL.createObjectURL(blob))
   .catch(e=>{cached.delete(key);throw e});
  cached.set(key,prom);
 }
 return cached.get(key);
};
function warm(clips){/* Deliberately disabled concurrent TTS prefetch: welcome audio takes priority. */}
function setStatus(msg){const el=$('audio-status');if(el)el.textContent=msg}
function stop(){
 ticket++;
 if(activePlayer){activePlayer.pause();activePlayer.onended=null;activePlayer.onerror=null;activePlayer=null}
 if(activeResolve){activeResolve(false);activeResolve=null}
 activePlaying=false;
}
async function speak(clip,t=ticket){
 if(t!==ticket)return false;
 setStatus('🔊 Preparing your narrator…');
 try{
  const url=await makeUrl(clip);if(t!==ticket)return false;
  const player=new Audio(url);activePlayer=player;
  const ended=new Promise(resolve=>{activeResolve=resolve;player.onended=()=>{activeResolve=null;resolve(true)};player.onerror=()=>{activeResolve=null;resolve(false)}});
  await player.play();activePlaying=true;
  const ok=await ended;activePlaying=false;
  if(t===ticket){activePlayer=null;setStatus(ok?'':'The voice stopped. Please replay this step.')}
  return t===ticket&&ok;
 }catch(e){
  if(t===ticket)setStatus('Audio could not play. Please try Replay instructions.');
  activePlaying=false;return false;
 }
}
function pause(ms,t){return new Promise(resolve=>setTimeout(()=>resolve(t===ticket),ms))}
async function talk(clips,t=ticket){
 if(!narration)return false;
 for(const clip of clips){if(t!==ticket)return false;if(!(await speak(clip,t)))return false}
 return true;
}
function soundVoice(){return '<div class="voice"><div class="voice-row"><label for="voice">Narrator</label><select id="voice" onchange="chooseVoice(this.value)"><option value="marin">Marin · warm</option><option value="cedar">Cedar · calm</option></select><label for="pace">Practice pace</label><select id="pace" onchange="choosePace(this.value)"><option value="relaxed">Relaxed</option><option value="extra">Extra thinking time</option></select><button class="alt" onclick="toggleAudio()" id="audio-toggle">'+(narration?'🔊 Sound on':'🔇 Sound off')+'</button></div><span class="status" id="audio-status" role="status"></span></div>'}
function voiceSet(){if($('voice'))$('voice').value=voice;if($('pace'))$('pace').value=pace}
function chooseVoice(v){stop();voice=v;sessionStorage.setItem('spellquest-ai-voice',v);cached.clear();if(narration)replay()}
function choosePace(v){pace=v;localStorage.setItem('spellquest-sound-pace',v)}
function toggleAudio(){narration=!narration;localStorage.setItem('spellquest-audio-first',narration?'on':'off');stop();if($('audio-toggle'))$('audio-toggle').textContent=narration?'🔊 Sound on':'🔇 Sound off';if(narration)replay()}
function replay(){
 if(stage==='welcome')return introAudio();
 if(stage==='question')return instructionAudio();
 if(stage==='review')return reviewAudio();
 if(stage==='retry')return retryAudio();
 if(stage==='success')return successAudio();
 if(stage==='finished')return speak('y6-v08-complete');
}
function progress(){return '<div class="progress" role="progressbar" aria-label="Words completed" aria-valuemin="0" aria-valuemax="10" aria-valuenow="'+idx+'"><div style="width:'+(idx*10)+'%"></div></div>'}
function welcome(){
 stop();stage='welcome';
 app.innerHTML='<span class="eyebrow">WELCOME, WORD EXPLORER!</span><h2>Your adventure starts here 🌟</h2>'+
 '<p>We’ll explore spellings at your own pace. Words you already know move into your collection, and tricky words get extra help. You can listen again or finish whenever you like.</p>'+
 '<p>We’re not testing how you compare to anybody else. We’re finding out what you can learn.</p>'+
 soundVoice()+'<div class="actions"><button onclick="begin()">▶ Start and hear your welcome</button></div>'+
 '<p class="muted small">Tap Start once to enable audio. Your narrator explains the next steps aloud.</p>';
 voiceSet();warm(['spellmaster-adaptive-welcome-v1','y6-v08-prompt','y6-necessary','y6-v08-wrong']);
}
async function introAudio(){
 stop();const t=ticket;
 const ok=await talk(['spellmaster-adaptive-welcome-v1'],t);
 if(ok&&t===ticket&&stage==='welcome')question(true);
}
function begin(){idx=0;first=0;results=[];narration=true;localStorage.setItem('spellquest-audio-first','on');introAudio()}
function question(auto=false){
 stop();stage='question';const w=WORDS[idx];
 app.innerHTML='<span class="eyebrow">WORD '+(idx+1)+' OF 10</span>'+progress()+
 '<h2>Listen, then spell</h2><p>Listen to the word. Type the spelling when you are ready. You can hear it as often as you need.</p>'+
 '<div class="actions"><button class="alt" onclick="speak(\'y6-'+WORDS[idx].word+'\')">🔊 Hear word again</button><button class="alt" onclick="instructionAudio()">🔊 Replay instructions</button></div>'+
 '<label for="answer">Your spelling</label><input id="answer" aria-label="Type the spelling of the spoken word" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')check(false)">'+soundVoice()+
 '<button onclick="check(false)">Check my spelling →</button>';
 voiceSet();warm(['y6-v08-prompt','y6-'+w.word,'y6-v08-wrong','y6-v08-sounds']);
 if(auto&&narration)instructionAudio();
}
async function instructionAudio(){
 stop();const t=ticket;await talk(['y6-v08-prompt','y6-'+WORDS[idx].word],t);
}
function check(retry){
 const inp=$('answer');const guess=inp.value.toLowerCase().replace(/[^a-z]/g,'');if(!guess){inp.focus();return}
 const yes=guess===WORDS[idx].word;
 if(!retry){results[idx]={word:WORDS[idx].word,initial:yes,learned:yes,attempts:1};if(yes)first++}
 else{results[idx].attempts++;if(yes)results[idx].learned=true}
 if(yes)success(retry);else review();
}
function success(improved){
 stop();stage='success';
 app.innerHTML='<span class="eyebrow">WORD '+(idx+1)+' OF 10</span>'+progress()+
 '<h2>'+(improved?'You learned something new! 🌱':'You remembered it! 🌟')+'</h2>'+
 '<div class="good">That spelling came from you. Every word you learn is your own progress.</div>'+
 soundVoice()+'<div class="actions"><button onclick="next()">Next word →</button><button class="alt" onclick="successAudio()">🔊 Replay encouragement</button></div>';
 voiceSet();if(narration)successAudio();
}
async function successAudio(){stop();await talk([results[idx].initial?'y6-correct':'y6-improved'],ticket)}
function review(){
 stop();stage='review';const w=WORDS[idx];
 app.innerHTML='<span class="eyebrow">LET’S LEARN WORD '+(idx+1)+'</span>'+progress()+
 '<h2>Let’s work through it together</h2>'+
 '<p>First we say the word. Then we hear the spoken parts slowly. Finally we discover the tricky spelling.</p>'+
 '<div id="review-content"><p class="now">🔊 Listen to your narrator...</p></div>'+
 soundVoice()+
 '<div class="actions"><button class="alt" onclick="reviewAudio()">🔊 Replay the lesson</button><button id="hide-button" onclick="retry()">🙈 Hide and spell again</button></div>';
 voiceSet();
 const clips=['y6-v08-wrong','y6-v08-sounds','y6-v08-spelling','y6-v08-ready','y6-'+w.word,'y6-tip-'+w.word];
 w.sounds.forEach((_,j)=>clips.push('y6-v08-sound-'+w.word+'-'+j));warm(clips);
 if(narration)reviewAudio();
}
async function reviewAudio(){
 stop();stage='review';const t=ticket,w=WORDS[idx],host=$('review-content');
 if(!host)return;
 host.innerHTML='<div class="note"><strong>Step 1: Hear the whole word</strong><p>Listen carefully, then say the word yourself.</p></div>';
 let ok=await talk(['y6-v08-wrong','y6-'+w.word],t);if(!ok)return;
 if(!(await pause(pace==='extra'?3000:2100,t)))return;
 host.innerHTML='<div class="note"><strong>Step 2: Hear the spoken parts</strong><p>Listen and say each one back. We will give you time.</p></div>'+
 '<div class="sound-row" id="sound-row">'+w.sounds.map((v,j)=>'<div class="sound" id="sound-'+j+'">'+v+'</div>').join('')+'</div>';
 ok=await talk(['y6-v08-sounds'],t);if(!ok)return;
 for(let j=0;j<w.sounds.length;j++){
  if(t!==ticket||stage!=='review')return;
  document.querySelectorAll('.sound').forEach((el,k)=>el.classList.toggle('active',k===j));
  ok=await speak('y6-v08-sound-'+w.word+'-'+j,t);if(!ok)return;
  if(!(await pause(pace==='extra'?3100:2250,t)))return;
 }
 if(t!==ticket)return;
 document.querySelectorAll('.sound').forEach(el=>el.classList.remove('active'));
 host.innerHTML='<div class="note"><strong>Step 3: Learn the written spelling</strong><p>Now we look at the letters that make up the word. They are not always the same as the spoken parts.</p></div>'+
 '<div class="spelling-row">'+w.spelling.map(x=>'<span>'+x+'</span>').join('')+'</div>'+
 '<div class="tip" id="trick"><strong>Memory trick</strong><p>Listen to the explanation from your narrator.</p></div>';
 ok=await talk(['y6-v08-spelling','y6-tip-'+w.word,'y6-v08-ready'],t);
 if(ok&&t===ticket&&stage==='review'){
  $('trick').innerHTML='<strong>Memory trick</strong><p>'+({necessary:'One C, two S letters: one collar, two sleeves.',embarrass:'Two R letters and two S letters.',accommodate:'Double C and double M.'}[w.word]||'Remember the tricky letter pattern you just heard.')+'</p>';
  setStatus('Ready when you are. The next step will hide the spelling.');
 }
}
function retry(){
 stop();stage='retry';
 app.innerHTML='<span class="eyebrow">WORD '+(idx+1)+' · TRY AGAIN</span>'+progress()+
 '<h2>Now it’s your turn</h2><p>The spelling is hidden. Listen to the word, and try it yourself.</p>'+
 '<div class="actions"><button class="alt" onclick="speak(\'y6-'+WORDS[idx].word+'\')">🔊 Hear word again</button></div>'+
 '<label for="answer">Your spelling</label><input id="answer" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')check(true)">'+soundVoice()+
 '<div class="actions"><button onclick="check(true)">Check my spelling →</button><button class="alt" onclick="review()">Hear the lesson again</button></div>';
 voiceSet();if(narration)retryAudio();
}
async function retryAudio(){stop();await talk(['y6-v08-retry','y6-'+WORDS[idx].word],ticket)}
function next(){idx++;if(idx===WORDS.length)finish();else question(true)}
function finish(){
 stop();stage='finished';const learned=results.filter(r=>r.learned).length;
 let history=[];try{history=JSON.parse(localStorage.getItem('spellquest-y6-practice')||'[]')}catch(e){}
 history.push({date:new Date().toISOString().slice(0,10),first,learned,results});localStorage.setItem('spellquest-y6-practice',JSON.stringify(history.slice(-20)));
 app.innerHTML='<span class="eyebrow">YOUR JOURNEY TODAY</span><h2>Look how far you’ve come! 🌟</h2>'+
 '<div class="good"><strong>'+first+'</strong> words remembered immediately; <strong>'+learned+'</strong> spelled during practice.</div>'+
 '<p>Your progress is what matters. We can try again another day to see what you remember.</p>'+
 results.map(r=>'<div class="result"><strong>'+r.word+'</strong> — '+(r.initial?'Remembered straight away':r.learned?'Learned with help':'Ready to revisit')+'</div>').join('')+
 soundVoice()+'<div class="actions"><button onclick="welcome()">Start again</button><button class="alt" onclick="location.href=\'/\'">Back to Spellmaster</button></div>';
 voiceSet();if(narration)talk(['y6-v08-complete']);
}
window.addEventListener('pagehide',stop);
welcome();
</script><script>
// Spellmaster adaptive intake: appends to the experimental staging lesson.
// The formal curriculum and sound teaching gates remain separate.
const ADAPTIVE_KEY='spellmaster-staging-intake-v1';
let runCount=0,runStart=0,runFirst=0,runNew=0,runSeen=new Set(),runResults=[],runReview=false;
function adaptiveToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function adaptiveDatePlus(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function adaptiveLoad(){try{return JSON.parse(localStorage.getItem(ADAPTIVE_KEY)||'{}')}catch(e){return {}}}
function adaptiveSave(word,ok,fromReview,afterHelp){
 const all=adaptiveLoad(),entry=all[word]||{events:[],retained:0};
 if(fromReview&&ok&&!afterHelp)entry.retained++;
 entry.events.push({date:adaptiveToday(),correct:ok,mode:'independent_keyboard',afterHelp:!!afterHelp,review:!!fromReview});
 entry.next=adaptiveDatePlus(adaptiveToday(),ok?(entry.retained>=2?14:entry.retained?3:1):1);
 entry.vault=ok?(entry.retained?'protected':'collected'):'recovery_quest';
 all[word]=entry;localStorage.setItem(ADAPTIVE_KEY,JSON.stringify(all));
}
function adaptiveSelect(){
 const all=adaptiveLoad(),day=adaptiveToday();
 const due=WORDS.map((w,i)=>({i,word:w.word,record:all[w.word]}))
  .filter(x=>x.record&&x.record.next<=day&&!runSeen.has(x.word))
  .sort((a,b)=>a.record.next.localeCompare(b.record.next));
 const fresh=WORDS.map((w,i)=>({i,word:w.word})).filter(x=>!all[x.word]&&!runSeen.has(x.word));
 if(!due.length&&!fresh.length)return null;
 if(due.length&&(runCount%3!==2||!fresh.length))return {i:due[0].i,review:true};
 if(fresh.length)return {i:fresh[0].i,review:false};
 return {i:due[0].i,review:true};
}
function adaptiveStartWord(){
 const selection=adaptiveSelect();if(!selection)return finish();
 idx=selection.i;runReview=selection.review;runCount++;
 if(!runReview)runNew++;
 question(true);
 const heading=app.querySelector('.eyebrow');
 if(heading)heading.textContent=(runReview?'MEMORY QUEST':'NEW WORD')+' · CHALLENGE '+runCount;
}
begin=function(){
 runCount=0;runStart=Date.now();runFirst=0;runNew=0;runSeen=new Set();runResults=[];runReview=false;
 idx=0;first=0;results=[];narration=true;
 localStorage.setItem('spellquest-audio-first','on');
 introAudio();
};
introAudio=async function(){
 stop();const t=ticket;
 const ok=await talk(['spellmaster-adaptive-welcome-v1'],t);
 if(ok&&t===ticket&&stage==='welcome')adaptiveStartWord();
};
check=function(retry){
 const input=$('answer');if(!input)return;
 const guess=input.value.toLowerCase().replace(/[^a-z]/g,'');
 if(!guess){input.focus();return}
 const word=WORDS[idx].word,ok=guess===word;
 if(!retry){
  results[idx]={word,initial:ok,learned:ok,attempts:1};
  runResults.push({word,initial:ok,learned:ok,review:runReview});
  if(ok){first++;runFirst++}
  adaptiveSave(word,ok,runReview,false);
 }else{
  results[idx].attempts++;
  runResults[runResults.length-1].attempts=results[idx].attempts;
  if(ok){results[idx].learned=true;runResults[runResults.length-1].learned=true;adaptiveSave(word,true,false,true)}
 }
 if(ok){runSeen.add(word);success(retry)}else review();
};
next=function(){
 stop();const elapsed=(Date.now()-runStart)/60000,selection=adaptiveSelect();
 if(!selection||elapsed>=12)return finish();
 stage='choice';
 const text=elapsed>=8?'You have enjoyed a good short session. Would you like another word, or finish for today?':
 runFirst>=2?'You already knew some of those! They are saved for later memory checks. Would you like another word?':
 'Ready to explore another word, or would you prefer to finish here?';
 app.innerHTML='<span class="eyebrow">YOUR CHOICE</span><h2>Keep exploring?</h2><p>'+text+'</p>'+
 '<div class="note">There is no fixed weekly word limit. Previously learned words will come back on another day.</div>'+
 soundVoice()+'<div class="actions"><button onclick="adaptiveStartWord()">Another word →</button>'+
 '<button class="alt" onclick="finish()">Finish for today</button></div>';
 voiceSet();if(narration)talk(['y6-v08-next']);
};
finish=function(){
 stop();stage='finished';
 const remembered=runResults.filter(x=>x.initial).length;
 app.innerHTML='<span class="eyebrow">YOUR JOURNEY</span><h2>Look how far you have come! 🌟</h2>'+
 '<div class="good">You explored <strong>'+runCount+'</strong> words. <strong>'+remembered+
 '</strong> were correct on the first try.</div>'+
 '<p>Words you knew are saved for later review. Tricky words will return with a fresh opportunity to learn.</p>'+
 runResults.map(x=>'<div class="result"><strong>'+x.word+'</strong> — '+
 (x.initial?'Spelled independently':x.learned?'Improved with help':'Ready to practise again')+'</div>').join('')+
 soundVoice()+'<div class="actions"><button onclick="welcome()">Back to welcome</button>'+
 '<button class="alt" onclick="location.href=\'/\'">Home</button></div>';
 voiceSet();if(narration)talk(['y6-v08-complete']);
};
</script></body></html>
