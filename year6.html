<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpellQuest | Year 6 Sound-Led Adventure</title><style>
:root{font-family:system-ui,"Trebuchet MS",sans-serif;color:#25334f;background:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#eaf8ff,#fff8ef 55%,#f2eaff);min-height:100vh}main{max-width:810px;margin:auto;padding:20px 15px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{color:#5548c1;text-decoration:none;font-size:23px;font-weight:850}.muted{color:#67718d}.small{font-size:13px;line-height:1.5}.hero{background:linear-gradient(120deg,#554bc5,#9780ed);border-radius:27px;color:#fff;margin:20px 0;padding:28px}.hero h1{font-size:clamp(28px,5vw,39px);margin:7px 0}.hero p{line-height:1.55;margin-bottom:0}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:800;color:#6250c1}.hero .eyebrow{color:#e8e1ff}.panel{background:white;padding:26px;border-radius:25px;box-shadow:0 12px 30px #41417e15}h2{font-size:clamp(23px,4vw,28px);margin:12px 0}p{line-height:1.55}button,select,input{font:inherit}button{cursor:pointer;border:0;background:#6052d1;color:white;border-radius:14px;padding:14px 19px;font-weight:780;min-height:48px}button.alt{background:#ebe9ff;color:#433a90}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f7b650;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}select{padding:10px;border:2px solid #cdd1e5;border-radius:11px;max-width:100%}input{width:100%;padding:17px;border-radius:14px;border:2px solid #cdd3e9;font-size:24px;letter-spacing:.02em;margin:10px 0 17px}label{display:block;font-weight:750;margin:16px 0 6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.voice{background:#f2f1ff;padding:14px;border-radius:16px;margin:17px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.voice label{margin:0}.status{font-size:13px;color:#53637c;min-height:20px}.progress{height:12px;background:#e7e7f4;border-radius:40px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#54bca4}.chunks{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0}.chunk{padding:18px 17px;border-radius:14px;background:#e1efff;font-size:clamp(24px,5vw,35px);font-weight:850;transition:transform .12s,background .12s}.chunk:nth-child(2n){background:#ffebc1}.chunk:nth-child(3n){background:#e0f5e9}.chunk.active{background:#6251cc!important;color:#fff;box-shadow:0 0 0 5px #ded7ff;transform:scale(1.07)}.tip{padding:18px;border:2px solid #ffe2a3;background:#fff8e9;border-radius:15px}.notice{padding:15px;border-radius:14px;background:#e5f5ed}.result{background:#f3f2ff;padding:12px;border-radius:12px;margin:9px 0}.big{font-size:23px;font-weight:800}.quiet{font-size:13px;color:#626d85;text-align:center;padding:20px}@media(max-width:520px){main{padding:12px}.panel{padding:18px}.hero{padding:23px}.voice{align-items:stretch}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.chunk.active{transform:none}}
</style></head><body><main><header><a class="logo" href="/">✨ SpellQuest</a><span class="muted small">Better today than yesterday</span></header><section class="hero"><span class="eyebrow">A SOUND-LED ADVENTURE</span><h1>Your Year 6 spelling quest</h1><p>Hear it. Say it. Learn the sounds. Discover the spelling. Try again.</p></section><div class="panel" id="app"></div><footer class="quiet">Ten words from the Years 5–6 statutory list · No rankings · Your progress stays on this device</footer></main>
<script>
const W=[
{w:'necessary',p:['ne','ces','sa','ry'],tip:'One c and two s letters. Remember the shirt with one collar and two sleeves.'},
{w:'embarrass',p:['em','bar','rass'],tip:'There are two r letters and two s letters.'},
{w:'accommodate',p:['ac','com','mo','date'],tip:'Remember two c letters and two m letters.'},
{w:'government',p:['gov','ern','ment'],tip:'Keep the n in govern before adding ment.'},
{w:'foreign',p:['for','eign'],tip:'The ending is spelled e i g n. The sounds do not tell the whole story.'},
{w:'familiar',p:['fa','mil','iar'],tip:'Think of family to remember the beginning.'},
{w:'environment',p:['en','viron','ment'],tip:'Remember environ, then add ment.'},
{w:'privilege',p:['priv','i','lege'],tip:'The ending is spelled lege, not ledge.'},
{w:'rhythm',p:['rhyth','m'],tip:'Look closely at rh at the beginning and the letter y.'},
{w:'temperature',p:['tem','per','a','ture'],tip:'Remember the a before ture.'}
];
const $=id=>document.getElementById(id),app=$('app'),ENDPOINT='https://spellquest-voice-staging.onrender.com/api/voice';
let voice=sessionStorage.getItem('spellquest-ai-voice')||'marin';
let narration=localStorage.getItem('spellquest-audio-first')!=='off';
let stage='welcome',index=0,first=0,results=[],token=0,player=new Audio(),clips=new Map(),playing=false,unlocked=false;
player.preload='auto';
function clipUrl(clip){
 const key=voice+':'+clip;
 if(!clips.has(key)){
  const job=fetch(ENDPOINT+'?clip='+encodeURIComponent(clip)+'&voice='+encodeURIComponent(voice)).then(r=>{if(!r.ok)throw Error('Audio '+r.status);return r.blob()}).then(b=>URL.createObjectURL(b)).catch(e=>{clips.delete(key);throw e});
  clips.set(key,job);
 }
 return clips.get(key);
}
function warm(clipsToLoad){clipsToLoad.forEach(c=>clipUrl(c).catch(()=>{}))}
function setStatus(msg){const el=$('status');if(el)el.textContent=msg}
function interrupt(){token++;player.pause();player.onended=null;player.onerror=null;playing=false}
async function play(clip,t=token){
 if(t!==token)return false;
 try{
  setStatus('🔊 Narrator speaking…');
  const url=await clipUrl(clip);if(t!==token)return false;
  player.pause();player.src=url;player.currentTime=0;
  const outcome=new Promise((resolve)=>{player.onended=()=>resolve(true);player.onerror=()=>resolve(false)});
  await player.play();playing=true;const ended=await outcome;playing=false;if(t===token)setStatus('');return t===token&&ended;
 }catch(e){if(t===token)setStatus('Audio could not start. Select Replay narration, or check the device sound.');playing=false;return false}
}
async function sequence(clipsToPlay,t=token){
 for(const clip of clipsToPlay){if(t!==token||!narration)return false;const ok=await play(clip,t);if(!ok)return false}
 return true;
}
function voiceBox(){return '<div class="voice"><label for="voice">Voice</label><select id="voice" onchange="changeVoice(this.value)"><option value="marin">Marin · warm</option><option value="cedar">Cedar · calm</option></select><button class="alt" id="toggle" onclick="toggleNarration()">'+(narration?'🔊 Narration on':'🔇 Narration off')+'</button><span id="status" class="status" role="status"></span></div>'}
function voiceSet(){const el=$('voice');if(el)el.value=voice}
function toggleNarration(){narration=!narration;localStorage.setItem('spellquest-audio-first',narration?'on':'off');interrupt();const b=$('toggle');if(b)b.textContent=narration?'🔊 Narration on':'🔇 Narration off';if(narration)resumeNarration()}
function changeVoice(v){interrupt();voice=v;sessionStorage.setItem('spellquest-ai-voice',v);clips.clear();if(narration)resumeNarration()}
function resumeNarration(){if(stage==='question')play('y6-'+W[index].w);if(stage==='review')reviewFlow();if(stage==='correct')play('y6-correct');if(stage==='retry')play('y6-'+W[index].w)}
function progress(){return '<div class="progress" role="progressbar" aria-label="Words explored" aria-valuenow="'+index+'" aria-valuemin="0" aria-valuemax="10"><div style="width:'+(index*10)+'%"></div></div>'}
function welcome(){
 stage='welcome';interrupt();
 app.innerHTML='<span class="eyebrow">YOUR OWN PACE · TEN WORDS</span><h2>Ready to explore some spellings?</h2><p class="big">We’ll talk you through everything.</p><p>Press Start once to turn on the sound. After that, your narrator will guide you through each word.</p>'+voiceBox()+'<div class="actions"><button onclick="start()">▶ Start with sound</button></div><p class="muted small">The game will never compare you with other children.</p>';
 voiceSet();warm(['y6-demo-start','y6-necessary','y6-try','y6-demo-parts']);
}
async function start(){
 unlocked=true;index=0;first=0;results=[];
 // The child's Start click provides the initial media gesture.
 question(true,true);
}
function question(announce=false,firstQuestion=false){
 stage='question';interrupt();const w=W[index];
 app.innerHTML='<span class="eyebrow">WORD '+(index+1)+' OF 10</span>'+progress()+'<h2>Listen to the word</h2><p>Your narrator will say the word. Type what you hear.</p><div class="actions"><button class="alt" onclick="play(\'y6-'+W[index].w+'\')">🔊 Hear the word again</button></div><label for="answer">Your spelling</label><input id="answer" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Type the word you heard" onkeydown="if(event.key===\'Enter\')check()">'+voiceBox()+'<button onclick="check()">Check spelling →</button>';
 voiceSet();const t=token;
 warm(['y6-'+w.w,'y6-try','y6-demo-repeat','y6-demo-parts','y6-correct']);
 if(narration&&announce)(async()=>{if(firstQuestion){const ok=await play('y6-demo-start',t);if(!ok)return}if(t===token)await play('y6-'+w.w,t)})();
}
function check(){
 const inp=$('answer');const answer=inp.value.toLowerCase().replace(/[^a-z]/g,'');if(!answer){inp.focus();return}
 let correct=answer===W[index].w;results[index]={w:W[index].w,first:correct,learned:correct,tries:1};if(correct){first++;correctScreen(false)}else reviewScreen();
}
function correctScreen(improved){
 stage='correct';interrupt();app.innerHTML='<span class="eyebrow">WORD '+(index+1)+' OF 10</span>'+progress()+'<h2>'+(improved?'You learned something new! 🌱':'You remembered it! 🌟')+'</h2><p>You spelled the word yourself. That is progress worth celebrating.</p>'+voiceBox()+'<div class="actions"><button onclick="next()">Next word →</button><button class="alt" onclick="play(\'y6-'+(improved?'improved':'correct')+'\')">🔊 Hear that again</button></div>';voiceSet();if(narration)play(improved?'y6-improved':'y6-correct');
}
function reviewScreen(){
 stage='review';interrupt();let w=W[index];
 app.innerHTML='<span class="eyebrow">LET’S LEARN WORD '+(index+1)+'</span>'+progress()+'<h2>Hear it. Say it. Learn it.</h2><p>Listen to the whole word, then say it yourself. Watch each sound light up.</p><div class="chunks" id="chunks">'+w.p.map((p,j)=>'<span class="chunk" id="chunk-'+j+'">'+p+'</span>').join('')+'</div><div id="hint" class="tip" style="display:none"></div>'+voiceBox()+'<div class="actions"><button id="retry" onclick="retryScreen()">🙈 Hide and spell again</button><button class="alt" onclick="reviewFlow()">🔊 Replay the lesson</button><button class="alt" onclick="next()">Skip to next word</button></div>';voiceSet();
 const soundClips=w.p.map((_,j)=>'y6-part-'+w.w+'-'+j);
 warm(['y6-demo-repeat','y6-'+w.w,'y6-demo-parts',...soundClips,'y6-tip-'+w.w]);
 if(narration)reviewFlow();
}
async function reviewFlow(){
 if(stage!=='review')return;interrupt();const t=token,w=W[index];let ok;
 ok=await sequence(['y6-try','y6-demo-repeat','y6-'+w.w,'y6-demo-parts'],t);if(!ok)return;
 for(let j=0;j<w.p.length;j++){
  if(t!==token||stage!=='review')return;
  document.querySelectorAll('.chunk').forEach((el,k)=>el.classList.toggle('active',j===k));
  ok=await play('y6-part-'+w.w+'-'+j,t);if(!ok)return;
 }
 if(t!==token)return;
 document.querySelectorAll('.chunk').forEach(el=>el.classList.remove('active'));
 const hint=$('hint');if(hint){hint.style.display='block';hint.innerHTML='<strong>Word secret:</strong> '+w.tip}
 await play('y6-tip-'+w.w,t);
 if(t===token&&stage==='review'){setStatus('Now you can hide the word and try spelling it again.');const retry=$('retry');if(retry)retry.focus()}
}
function retryScreen(){
 stage='retry';interrupt();
 app.innerHTML='<span class="eyebrow">WORD '+(index+1)+' · TRY AGAIN</span>'+progress()+'<h2>What can you remember?</h2><p>The spelling is hidden. Listen and type it from memory.</p><button class="alt" onclick="play(\'y6-'+W[index].w+'\')">🔊 Hear the word again</button><label for="answer">Your spelling</label><input id="answer" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Type the word you heard" onkeydown="if(event.key===\'Enter\')retryCheck()">'+voiceBox()+'<div class="actions"><button onclick="retryCheck()">Check spelling →</button><button class="alt" onclick="reviewScreen()">Hear the lesson again</button></div>';voiceSet();if(narration)play('y6-'+W[index].w);
}
function retryCheck(){
 const inp=$('answer'),answer=inp.value.toLowerCase().replace(/[^a-z]/g,'');if(!answer){inp.focus();return}
 const r=results[index];r.tries++;if(answer===W[index].w){r.learned=true;correctScreen(true)}else reviewScreen();
}
function next(){index++;if(index>=W.length)finish();else question(true,false)}
function finish(){
 stage='finished';interrupt();const learned=results.filter(r=>r.learned).length;
 let history=[];try{history=JSON.parse(localStorage.getItem('spellquest-y6-practice')||'[]')}catch(e){}
 history.push({date:new Date().toISOString().slice(0,10),first,learned,results});localStorage.setItem('spellquest-y6-practice',JSON.stringify(history.slice(-20)));
 app.innerHTML='<span class="eyebrow">YOUR JOURNEY TODAY</span><h2>Look how far you’ve come! 🌟</h2><div class="notice"><strong>'+first+'</strong> words remembered straight away. <strong>'+learned+'</strong> spelled during practice.</div><p>The goal is to remember them again another day — you are learning at your pace.</p>'+results.map(r=>'<div class="result"><strong>'+r.w+'</strong> — '+(r.first?'Remembered independently':r.learned?'Learned with help':'Ready to revisit')+'</div>').join('')+voiceBox()+'<div class="actions"><button onclick="start()">Practise again</button><button class="alt" onclick="location.href=\'/\'">Back to SpellQuest</button></div>';voiceSet();if(narration)play('y6-demo-done');
}
window.addEventListener('pagehide',interrupt);welcome();
</script></body></html>
