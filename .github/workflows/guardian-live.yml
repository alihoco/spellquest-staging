name: Spellmaster guardian pilot live readiness
on:
  push:
    paths:
      - scripts/check-guardian-live.cjs
      - .github/workflows/guardian-live.yml
  workflow_dispatch:
jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-guardian-live.cjs
