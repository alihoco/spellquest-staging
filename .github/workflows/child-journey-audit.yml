name: Spellmaster simulated child visual journey audit
on:
  workflow_dispatch:
  push:
    paths:
      - year6.html
      - pilot-learning-focus.css
      - scripts/simulate-child-journey.mjs
      - scripts/expose-ui-audit-screenshots.mjs
      - .github/workflows/child-journey-audit.yml
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Simulate nine-year-old spelling journey at mobile and desktop widths
        run: node scripts/simulate-child-journey.mjs
      - name: Make synthetic screenshots inspectable without committing files
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/expose-ui-audit-screenshots.mjs
      - name: Preserve screenshots and inspection data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spellmaster-simulated-nine-year-old-audit
          path: child-journey-audit/
          retention-days: 14
