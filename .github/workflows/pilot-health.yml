name: Adult volunteer pilot external health check
on:
  push:
    paths:
      - scripts/check-pilot.cjs
      - .github/workflows/pilot-health.yml
  workflow_dispatch:
jobs:
  verify-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-pilot.cjs
