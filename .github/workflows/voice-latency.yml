name: Spellmaster narration real audio timing
on:
  push:
    paths:
      - scripts/measure-voice.mjs
      - server.js
      - .github/workflows/voice-latency.yml
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save music-metadata
      - run: node scripts/measure-voice.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spellmaster-voice-audit-samples
          path: voice-latency-audit/
          retention-days: 14
